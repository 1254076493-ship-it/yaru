<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天才的酒｜小红书内容工作台</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><p class="eyebrow">天才的酒 · 内部原型</p><h1>小红书内容生产工作台</h1><p>先把用户问题和事实说清楚，再生成、验收和返工。本版本是规则引擎原型，不冒充真实AI。</p></header>
<form id="task"><section><h2>1. 用户与主题</h2><label>内容主题<input name="topic" required placeholder="周岁封酒想存20年，先看什么"></label><label>目标用户<input name="audience" required value="第一次给孩子封酒的新手父母"></label><label>用户正在纠结什么<textarea name="confusion" required></textarea></label><label>用户最怕发生什么<textarea name="fear" required></textarea></label><label>看完希望用户明白什么<textarea name="desired_understanding" required></textarea></label></section>
<section><h2>2. 使用场景</h2><div class="grid"><label>家庭节点<select name="occasion"><option>周岁</option><option>满月</option><option>百天</option><option>补封</option><option>其他</option></select></label><label>计划开启时间<input name="opening_year" value="20年" required></label><label>内容目标<select name="goal"><option>收藏</option><option>咨询</option><option>信任</option><option>评论</option><option>成交</option><option>停留</option></select></label><label>留言关键词<input name="cta_keyword" value="周岁" required></label></div><label>允许使用的产品事实（每行一条）<textarea name="product_facts" placeholder="53度酱香酒&#10;素烧陶坛&#10;定期陪检"></textarea></label><label>补充资料<textarea name="additional_context"></textarea></label><button type="submit">生成并验收</button><p id="status"></p></section></form>
<section id="result" hidden><h2>3. 生成结果与验收</h2><div id="check"></div><h3>10个标题</h3><ol id="titles"></ol><h3>短文</h3><pre id="short"></pre><h3>长文</h3><pre id="long"></pre><button id="copy" type="button">复制全部</button></section></main><script src="/static/app.js"></script></body></html>
